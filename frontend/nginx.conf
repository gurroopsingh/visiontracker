# Map for WebSocket upgrade header — sends "upgrade" for WS, "close" for HTTP polling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Socket.IO — supports both WebSocket and HTTP long-polling transports
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without a long timeout Nginx closes idle WebSocket connections after
        # 60s, causing silent disconnects and missed real-time notifications.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy uploads
    location /uploads/ {
        proxy_pass http://backend:5000;
    }
}
