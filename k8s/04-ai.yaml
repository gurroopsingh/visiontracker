apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels:
    app: ai
spec:
  # Usually 1 replica for AI unless you have a beefy cluster
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: visiontracker-ai:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: AI_SERVICE_PORT
              value: "8000"
            - name: AI_MATCH_THRESHOLD
              value: "0.75"
            - name: CLIP_MODEL_NAME
              value: "openai/clip-vit-base-patch32"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  labels:
    app: ai
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ai
